# The repository states its review requirement ONCE, in the always-active form the
# vendor's own footgun guidance recommends: if: true, with the branch scoping moved
# into success_conditions instead of into if:.
merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: reviewed-everywhere
    if: true
    success_conditions:
      - or:
          - base != main
          - "#approved-reviews-by >= 1"
      - check-success = ci
