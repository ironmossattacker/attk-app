# Lab config — merge protection satisfied by CI alone so the freeze is the
# only remaining protection. Mirrors Mergify's documented enforcement setup:
# `Mergify Merge Protections` is a required status check in the repository ruleset.
merge_protections:
  - name: green on main
    if:
      - base = main
    success_conditions:
      - check-success = ci

queue_rules:
  - name: default
    merge_conditions:
      - check-success = ci
    merge_method: squash
    batch_size: 1
