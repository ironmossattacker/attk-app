name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flake:
        description: "1 = force test_flip to fail on this SHA (quarantine study)"
        default: "0"
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest --junitxml=report.xml
        env:
          FLAKE: ${{ inputs.flake || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: report.xml
